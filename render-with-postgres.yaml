# Deploy this directory as the repository root. These are PAID Render plans.
# Keep one instance: worker connection, tickets and conversation locks are in-process.
services:
  - type: web
    name: sriaas-ai-backend
    runtime: node
    region: singapore
    plan: starter
    numInstances: 1
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.3
      - key: AUTH_MODE
        value: test-key
      - key: TEST_API_KEY
        generateValue: true
      - key: MODEL_TRANSPORT
        value: worker
      - key: MODEL_WORKER_TOKEN
        generateValue: true
      - key: STORAGE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: sriaas-ai-history
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: GEMMA_MODEL
        value: voice-lab-gemma4
      - key: MAX_OUTPUT_TOKENS
        value: "1024"
      - key: VOICE_SESSION_SECONDS
        value: "600"
databases:
  - name: sriaas-ai-history
    region: singapore
    plan: 0.1c-256mb
    diskSizeGB: 1
    databaseName: sriaas_assistant
    user: sriaas_assistant
    ipAllowList: []
